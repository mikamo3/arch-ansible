[defaults]
result_format = yaml
inventory = inventories/hosts.yml
roles_path = roles
library = library:library/ansible-aur/plugins/modules
host_key_checking = False
interpreter_python = /usr/bin/python
nocows = True
vault_password_file = op_vault_pass.sh

[connection]
# Without pipelining, sudo runs under ssh -tt and pam_systemd (systemd 258+)
# writes OSC 3008 context sequences to the TTY -> "junk after the JSON data".
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
