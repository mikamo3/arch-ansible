---
devices:
  cpu:
    vendor: amd
  gpu:
    type: nvidia
    cuda: true
    integrated: amd
  audio: true
  bluetooth: true
  printer: false

desktop:
  environment: xfce
  display_manager: xrdp
  ime: fcitx5

apps:
  browser: true
  file_manager: false
  editor: true
  pdf: false
  remote: false
  torrent: false
  password_manager: false
  file_share: false

media:
  cli_tools: true
  playback: true
  editing: false

development:
  editor: false
  git_tools: true
  cli_tools: true
  docker: true

storage:
  cloud_sync: false
  encryption: true
  nfs: true
  iscsi: true
  iscsi_portal: 192.168.100.70
  iscsi_target: iqn.2005-10.org.freenas.ctl:temp
  sshfs_server: true
  btrfs_mounts:
    - subvol: "@stable_diffusion_data"
      mountpoint: /sd_data
      uuid: 35a691a7-7d8c-424d-b179-95444aa59e6b
    - subvol: "@sd_output"
      mountpoint: /sd_output
      uuid: 86fa44b7-d1a9-4641-a3d3-ab4eb9990cca
    - subvol: "@sd_assets"
      mountpoint: /sd_assets
      uuid: 86fa44b7-d1a9-4641-a3d3-ab4eb9990cca

security:
  # Default-deny internet egress (sensitive generated assets on this host).
  egress_guard:
    lan: 192.168.100.0/24
    dns: 192.168.100.1
    internet_users: [mikamo]
    # sd_reforge_docker "ai-download" network (downloader container).
    download_subnet: 10.89.250.0/24

network:
  wired:
    interface: enp7s0
    ip: 192.168.100.10/24
    gateway: 192.168.100.1
    dns:
      - 192.168.100.1
  wifi:
    interface: wlp6s0
    ssid: "{{ wifi_ssid }}"
    password: "{{ wifi_password }}"
