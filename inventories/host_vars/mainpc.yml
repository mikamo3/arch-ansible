---
# Connection
ansible_connection: ssh

# Base
base:
  hostname: mainpc
  timezone: Asia/Tokyo
  locale: ja_JP.UTF-8
  static_network:
    enabled: true
    interface: eno1
    ip_address: 192.168.100.100
    prefix: 24
    gateway: 192.168.100.1
    dns_servers:
      - 192.168.100.1
      - 8.8.8.8
  main_user:
    name: mikamo
    groups:
      - wheel
      - users

# Devices
devices:
  gpu: amd
  audio: true
  bluetooth: true
  printer: true

# Desktop
desktop:
  environment: hyprland
  display_manager: ly
  fonts: full
  input_method: fcitx5-mozc-ut

# Shell
shell:
  dotfiles: true

# Media
media:
  playback: true
  editing: true

# Office
office:
  libreoffice: true
  cad: true

# Development
development:
  enabled: true
  container: true

# Virtualization
virtualization:
  enabled: true
