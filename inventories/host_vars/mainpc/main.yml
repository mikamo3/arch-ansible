---
devices:
  cpu:
    vendor: amd
  gpu:
    type: amd # AMD Radeon 680M (integrated)
  audio: true
  bluetooth: true
  printer: true

desktop:
  environment: hyprland
  display_manager: greetd
  ime: fcitx5

apps:
  browser: true
  file_manager: true
  editor: true
  pdf: true
  remote: true
  torrent: true
  password_manager: true
  file_share: true

media:
  cli_tools: true
  playback: true
  editing: true

office:
  suite: true

development:
  editor: true
  git_tools: true
  cli_tools: true
  docker: true

virtualization:
  kvm: true
  kvm_default_network: true
  virtualbox: true

storage:
  cloud_sync: true
  encryption: true
  nfs: true

cad:
  install: true

network:
  wired:
    interface: eno1
    ip: 192.168.100.100/24
    gateway: 192.168.100.1
    dns:
      - 192.168.100.1
  wifi:
    interface: wlp2s0
    ssid: "{{ wifi_ssid }}" # Defined in secret.yml
    password: "{{ wifi_password }}" # Defined in secret.yml
