---
# Connection
ansible_connection: ssh

# Base
base:
  hostname: nucbox
  timezone: Asia/Tokyo
  locale: ja_JP.UTF-8
  static_network:
    enabled: true
    interface: eno1
    ip_address: 192.168.10.220
    prefix: 24
    gateway: 192.168.10.1
    dns_servers:
      - 192.168.10.1
      - 8.8.8.8
  main_user:
    name: mikamo
    groups:
      - wheel
      - users

# Devices
devices:
  gpu: intel
  audio: true
  bluetooth: false
  printer: false

# Desktop
desktop:
  environment: hyprland
  display_manager: ly
  fonts: minimal
  input_method: fcitx5-mozc-ut

# Shell
shell:
  dotfiles: true

# Media
media:
  playback: true
  editing: false

# Office
office:
  libreoffice: false
  cad: false

# Development
development:
  enabled: false
  container: false

# Virtualization
virtualization:
  enabled: false
