---
# ly (TUI display manager) installation and configuration

- name: Install ly packages
  aur:
    name:
      - ly # TUI display manager
    state: present
  become_user: "{{ ansible_user }}"

- name: Create ly configuration directory
  ansible.builtin.file:
    path: /etc/ly
    state: directory
    mode: "0755"
  become: true

- name: Deploy ly configuration file
  ansible.builtin.template:
    src: ly.config.ini.j2
    dest: /etc/ly/config.ini
    mode: "0644"
    backup: true
  become: true

- name: Disable getty@tty1 service
  ansible.builtin.systemd:
    name: getty@tty1
    enabled: false
    daemon_reload: true
  become: true

- name: Enable ly@tty1 service
  ansible.builtin.systemd:
    name: ly@tty1
    enabled: true
    daemon_reload: true
  become: true
