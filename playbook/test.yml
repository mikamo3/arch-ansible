---
- hosts: "{{ target | default('sandbox') }}"
  gather_facts: false
  tasks:
    - name: ping
      ansible.builtin.ping:

    - name: whoami (become前)
      ansible.builtin.command: whoami
      register: whoami_result
      changed_when: false

    - name: whoami結果表示
      ansible.builtin.debug:
        msg: "接続ユーザー: {{ whoami_result.stdout }}"

    - name: whoami (become後)
      ansible.builtin.command: whoami
      become: true
      register: whoami_become_result
      changed_when: false

    - name: become結果表示
      ansible.builtin.debug:
        msg: "becomeユーザー: {{ whoami_become_result.stdout }}"
