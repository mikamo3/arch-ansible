---
base:
  parallel_downloads: 5
  reflector:
    country: JP
    latest: 5
    sort: rate
  journald:
    Storage: persistent
    Compress: "yes"
    SystemMaxUse: 1G
    SystemKeepFree: 2G
    SystemMaxFileSize: 128M
    MaxRetentionSec: 1month
    MaxFileSec: 1week
  fwupd: true
  extra_kernel_headers: []     # 追加カーネルヘッダ (例: [linux-zen-headers, linux-lts-headers])
