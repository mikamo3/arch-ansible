---
- name: Configure pacman and update cache
  ansible.builtin.import_tasks: pacman.yml
  tags: [base, pacman]

- name: Install base packages
  ansible.builtin.import_tasks: packages.yml
  tags: [base, packages]

- name: Set up AUR helper (paru)
  ansible.builtin.import_tasks: aur.yml
  tags: [base, aur]

- name: Configure systemd (logind/journald/oomd)
  ansible.builtin.import_tasks: systemd.yml
  tags: [base, systemd]

- name: Set up maintenance automation (reflector/paccache/fwupd)
  ansible.builtin.import_tasks: maintenance.yml
  tags: [base, maintenance]

- name: Configure network (NetworkManager)
  ansible.builtin.import_tasks: network.yml
  tags: [base, network]
