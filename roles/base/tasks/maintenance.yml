---
- name: systemd ユニット定義をリロード
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: reflector 設定ディレクトリを作成
  ansible.builtin.file:
    path: /etc/xdg/reflector
    state: directory
    mode: "0755"
  become: true

- name: reflector.conf を配置
  ansible.builtin.template:
    src: reflector.conf.j2
    dest: /etc/xdg/reflector/reflector.conf
    mode: "0644"
  become: true
  notify: run reflector

- name: reflector.timer を有効化
  ansible.builtin.systemd:
    name: reflector.timer
    enabled: true
    state: started
  become: true

- name: paccache.timer を有効化
  ansible.builtin.systemd:
    name: paccache.timer
    enabled: true
    state: started
  become: true

- name: fwupd-refresh.timer を有効化
  ansible.builtin.systemd:
    name: fwupd-refresh.timer
    enabled: true
    state: started
  become: true
  when: base.fwupd | default(true)
