---
- name: 基本パッケージをインストール
  community.general.pacman:
    name:
      # ビルド/カーネル
      - base-devel
      - linux-headers

      # ファイルシステム
      - btrfs-progs
      - dosfstools

      # ドキュメント
      - man-db
      - man-pages

      # パッケージ管理
      - pacman-contrib
      - reflector

      # ネットワーク/転送
      - curl
      - wget
      - rsync

      # firewall 基盤 (nftables バックエンド + iptables CLI 互換)
      - iptables-nft

      # 個別ツール
      - git-crypt
    state: present
  become: true

- name: 追加カーネルヘッダ (DKMS 等で必要なカーネル分)
  community.general.pacman:
    name: "{{ base.extra_kernel_headers }}"
    state: present
  become: true
  when: base.extra_kernel_headers | length > 0

- name: fwupd をインストール
  community.general.pacman:
    name: fwupd
    state: present
  become: true
  when: base.fwupd | default(true)
