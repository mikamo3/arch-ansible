---
- name: Install fonts
  aur:
    name:
      # fallback (Noto)
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      # Japanese monospace (PlemolJP full)
      - ttf-plemoljp-bin
      # programming + Japanese
      - ttf-cica
      - ttf-udev-gothic
      - ttf-hackgen
      # Latin programming (IBM Plex)
      - ttf-ibm-plex
      # Japanese GUI (Morisawa BIZ UDPGothic)
      - morisawa-biz-ud-gothic-fonts
      # Latin GUI
      - inter-font
    state: present
    use: paru
  become: false

- name: Install IME (fcitx5 + mozc)
  aur:
    name:
      - fcitx5
      - fcitx5-configtool
      - fcitx5-mozc
      - fcitx5-gtk
      - fcitx5-qt
    state: present
    use: paru
  become: false
  when: desktop.ime == 'fcitx5'

- name: Create /etc/environment.d directory
  ansible.builtin.file:
    path: /etc/environment.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  when: desktop.ime == 'fcitx5'

- name: Set IME environment variable (for XWayland X11 apps only)
  # GTK4 / Qt6 communicate with fcitx5 natively via Wayland text-input-v3,
  # so GTK_IM_MODULE / QT_IM_MODULE are intentionally not set (setting them causes fcitx5 warnings).
  # Only XMODIFIERS is kept for X11 apps running via XWayland.
  ansible.builtin.copy:
    dest: /etc/environment.d/10-fcitx5.conf
    content: |
      XMODIFIERS=@im=fcitx
    mode: "0644"
    owner: root
    group: root
  become: true
  when: desktop.ime == 'fcitx5'

- name: Install Qt Wayland support
  aur:
    name:
      - qt5-wayland
      - qt6-wayland
    state: present
    use: paru
  become: false

- name: Install Wayland common base
  aur:
    name:
      - xorg-xwayland           # compatibility layer to run X11 apps on Wayland
      - xdg-user-dirs           # standard directories: ~/Documents, ~/Pictures, etc.
    state: present
    use: paru
  become: false

- name: Install Secret / Keyring (required for credential storage by 1Password etc.)
  aur:
    name:
      - gnome-keyring           # keyring daemon
      - libsecret               # Secret Service API
    state: present
    use: paru
  become: false

- name: Install Bluetooth GUI (only when devices.bluetooth is enabled)
  aur:
    name:
      - blueman
    state: present
    use: paru
  become: false
  when: devices.bluetooth | default(false)

- name: Install python-psutil (required for dconf module)
  ansible.builtin.package:
    name: python-psutil
    state: present
  become: true
  when: devices.bluetooth | default(false)

- name: Disable blueman connection notifications
  community.general.dconf:
    key: /org/blueman/general/show-notifications
    value: "false"
    state: present
  when: devices.bluetooth | default(false)

- name: Install PipeWire mixer GUI (only when devices.audio is enabled, works via pipewire-pulse)
  aur:
    name:
      - pavucontrol
    state: present
    use: paru
  become: false
  when: devices.audio | default(false)
