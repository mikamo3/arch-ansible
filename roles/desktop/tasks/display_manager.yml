---
- name: Install greetd + tuigreet
  aur:
    name:
      - greetd
      - greetd-tuigreet
    state: present
    use: paru
  become: false
  when: desktop.display_manager == 'greetd'

- name: Configure greetd (launch Hyprland via uwsm)
  ansible.builtin.template:
    src: greetd-config.toml.j2
    dest: /etc/greetd/config.toml
    mode: "0644"
    owner: root
    group: root
  become: true
  when: desktop.display_manager == 'greetd'

- name: Ensure greetd systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/greetd.service.d
    state: directory
    mode: "0755"
  become: true
  when: desktop.display_manager == 'greetd'

- name: Configure greetd VT systemd conflicts
  ansible.builtin.template:
    src: greetd-service-override.conf.j2
    dest: /etc/systemd/system/greetd.service.d/override.conf
    mode: "0644"
    owner: root
    group: root
  become: true
  when: desktop.display_manager == 'greetd'
  notify: reload systemd daemon

- name: Enable greetd.service
  ansible.builtin.systemd:
    name: greetd
    enabled: true
  become: true
  when: desktop.display_manager == 'greetd'

- name: Add gnome-keyring auth to greetd PAM
  ansible.builtin.lineinfile:
    path: /etc/pam.d/greetd
    insertafter: "^auth.*include.*system-login"
    line: "auth       optional   pam_gnome_keyring.so"
    regexp: "^auth.*pam_gnome_keyring"
  become: true
  when: desktop.display_manager == 'greetd'

- name: Add gnome-keyring session to greetd PAM
  ansible.builtin.lineinfile:
    path: /etc/pam.d/greetd
    insertafter: "^session.*include.*system-login"
    line: "session    optional   pam_gnome_keyring.so auto_start"
    regexp: "^session.*pam_gnome_keyring"
  become: true
  when: desktop.display_manager == 'greetd'

- name: Install xrdp
  aur:
    name:
      - xrdp
      - xorgxrdp
    state: present
    use: paru
  become: false
  when: desktop.display_manager == 'xrdp'

- name: Allow non-console users to run Xorg (required for xrdp)
  ansible.builtin.copy:
    content: "allowed_users=anybody\nneeds_root_rights=yes\n"
    dest: /etc/X11/Xwrapper.config
    owner: root
    group: root
    mode: "0644"
  become: true
  when: desktop.display_manager == 'xrdp'

- name: Enable xrdp.service
  ansible.builtin.systemd:
    name: xrdp
    enabled: true
  become: true
  when: desktop.display_manager == 'xrdp'
