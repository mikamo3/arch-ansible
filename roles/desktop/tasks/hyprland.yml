---
# Hyprland desktop environment installation

# Prerequisite: Ensure qt6-wayland is installed (required for hyprsysteminfo-git)
- name: Install Qt6 Wayland support
  pacman:
    name:
      - qt6-wayland
    state: present
  become: true

# Conflict resolution: Remove stable hyprutils before installing -git variant
- name: Remove stable hyprutils to avoid conflicts with hyprutils-git
  pacman:
    name: hyprutils
    state: absent
  become: true
  ignore_errors: true

# Install hypersysteminfo and dependencies in dependency order
# to ensure all -git variants build and install successfully
- name: Install hyprutils-git (base dependency)
  aur:
    name:
      - hyprutils-git
    state: present
  become_user: "{{ ansible_user }}"

- name: Install hyprlang-git (dependency for hyprland-qt-support-git)
  aur:
    name:
      - hyprlang-git
    state: present
  become_user: "{{ ansible_user }}"

- name: Install hyprland-qt-support-git (dependency for hyprsysteminfo-git)
  aur:
    name:
      - hyprland-qt-support-git
    state: present
  become_user: "{{ ansible_user }}"

- name: Install hyprsysteminfo-git (maintained version, stable hyprutils not available)
  aur:
    name:
      - hyprsysteminfo-git
    state: present
  become_user: "{{ ansible_user }}"

- name: Install Hyprland desktop environment
  aur:
    name:
      # Core Hyprland packages
      - hyprland # Hyprland compositor
      - hyprpaper # Wallpaper utility for Hyprland
      - hypridle # Idle management for Hyprland
      - swayidle # Alternative idle management daemon for Wayland
      - hyprlock # Screen locker for Hyprland
      - hyprpicker # Color picker for Hyprland
      - hyprcursor # Hyprland cursor theme

      # Hyprland-specific utilities
      - waybar # Status bar for Wayland
      - waybar-module-pacman-updates-git # Pacman updates module for waybar
      - wttrbar # Weather information for waybar
      - wofi # Application launcher for Wayland
      - rofi # Alternative application launcher
      - wlogout # Logout menu
      - swaync # Notification daemon (swaync)
      - kanshi # Dynamic display configuration
      - wlr-randr # Display management for wlroots
      - wlroots # Wayland compositor library
      - wob # Wayland overlay bar (volume/brightness)

      # Clipboard and screenshot management
      - clipman # Clipboard manager
      - cliphist # Clipboard history
      - swappy # Screenshot annotation tool

      # Additional utilities
      - foot # Alternative terminal emulator
      - wallutils # Wallpaper utilities
      - dex # Desktop entry execution (autostart)
      - uwsm # Universal Wayland Session Manager
      - hyprls-git # Hyprland language server (development support)

      # Desktop portals and integration
      - xdg-desktop-portal-hyprland # Desktop portal for Hyprland
      - hyprpolkitagent # Hyprland-specific policy kit authentication agent

    state: present
  become_user: "{{ ansible_user }}"

