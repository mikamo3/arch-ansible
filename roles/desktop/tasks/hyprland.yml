---
- name: Install Hyprland and utilities
  aur:
    name:
      # core
      - hyprland                       # compositor
      - uwsm                           # Universal Wayland Session Manager
      - xdg-desktop-portal-hyprland    # portal (screen sharing / file picker)
      - hyprpolkitagent                # PolicyKit agent

      # terminals
      - ghostty
      - kitty                          # Hyprland default config launches with SUPER+Q

      # shell UI
      - waybar                         # status bar
      - wttrbar                        # weather module for waybar
      - fuzzel                         # app launcher
      - swaync                         # notification daemon + notification center

      # debug/diagnostics
      - wev                            # Wayland input event inspector

      # lock/idle/wallpaper
      - hyprlock                       # screen locker
      - hypridle                       # idle manager
      - hyprpaper                      # wallpaper

      # screenshots
      - grim                           # screen capture
      - slurp                          # region selection
      - swappy                         # screenshot annotation

      # clipboard
      - wl-clipboard
      - cliphist                       # clipboard history

      # hardware control
      - brightnessctl                  # brightness control
      - playerctl                      # media keys

      # NetworkManager integration
      - network-manager-applet
    state: present
    use: paru
  become: false
