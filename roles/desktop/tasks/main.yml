---
- name: Install common GUI base (fonts / IME / Qt-Wayland / basic utilities)
  ansible.builtin.import_tasks: common.yml
  tags: [desktop, common]

- name: Set up display manager ({{ desktop.display_manager }})
  ansible.builtin.import_tasks: display_manager.yml
  tags: [desktop, display_manager]

- name: Set up Hyprland environment
  ansible.builtin.import_tasks: hyprland.yml
  when: desktop.environment == 'hyprland'
  tags: [desktop, hyprland]

- name: Set up Openbox environment
  ansible.builtin.import_tasks: openbox.yml
  when: desktop.environment == 'openbox'
  tags: [desktop, openbox]
