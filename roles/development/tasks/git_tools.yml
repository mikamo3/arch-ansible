---
- name: Git 関連ツール
  aur:
    name:
      - git-lfs                  # Git Large File Storage
      - lazygit                  # Git TUI
      - git-delta                # 高機能 diff viewer
      - difftastic               # 構文ベース semantic diff
      - tokei                    # ソース行数カウント
      - gibo                     # .gitignore テンプレ取得
      - cocogitto                # Conventional Commits / SemVer CLI
    state: present
    use: paru
  become: false
