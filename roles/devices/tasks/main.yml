---
- name: GPU ドライバのインストール
  ansible.builtin.import_tasks: gpu.yml
  when: devices.gpu.type | default('none') != 'none'
  tags: [devices, gpu]

- name: オーディオ (PipeWire) のインストール
  ansible.builtin.import_tasks: audio.yml
  when: devices.audio | default(false)
  tags: [devices, audio]

- name: Bluetooth のインストール
  ansible.builtin.import_tasks: bluetooth.yml
  when: devices.bluetooth | default(false)
  tags: [devices, bluetooth]

- name: プリンタ (CUPS) のインストール
  ansible.builtin.import_tasks: printer.yml
  when: devices.printer | default(false)
  tags: [devices, printer]
