---
- import_tasks: btrfs_mounts.yml
  when: storage.btrfs_mounts is defined

- import_tasks: cloud_sync.yml
  when: storage.cloud_sync

- import_tasks: encryption.yml
  when: storage.encryption

- import_tasks: nfs.yml
  when: storage.nfs

- import_tasks: iscsi.yml
  when: storage.iscsi | default(false)

- name: Configure SSHFS client
  ansible.builtin.import_tasks: sshfs_client.yml
  when: storage.sshfs_client | default(false)
  tags: [sshfs]

- name: Configure SSHFS server
  ansible.builtin.import_tasks: sshfs_server.yml
  when: storage.sshfs_server | default(false)
  tags: [sshfs]
