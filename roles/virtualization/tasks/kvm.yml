---
- name: QEMU / libvirt 一式
  aur:
    name:
      - qemu-desktop           # QEMU (デスクトップ用最小構成)
      - libvirt                # 仮想化管理 API / デーモン
      - virt-manager           # GUI 管理ツール
      - virt-viewer            # VM コンソール表示 (virt-manager が内部利用)
      - dnsmasq                # default NAT 用 DHCP/DNS
      - edk2-ovmf              # UEFI ファームウェア (UEFI ブートゲスト用)
      - dmidecode              # DMI 情報 (Wiki 推奨)
    state: present
    use: paru
  become: false

- name: libvirt 関連サービス
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - libvirtd.service
    - virtlogd.service
  become: true

- name: ansible_user を libvirt グループに追加
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: libvirt
    append: true
  become: true

- name: default ネットワーク設定
  when: virtualization.kvm_default_network | default(true)
  block:
    - name: default ネットワークの状態を取得
      ansible.builtin.command: virsh net-info default
      register: virsh_default_info
      changed_when: false
      failed_when: false
      become: true

    - name: default ネットワークを定義 (未定義時のみ)
      ansible.builtin.command: virsh net-define /usr/share/libvirt/networks/default.xml
      when: virsh_default_info.rc != 0
      become: true

    - name: default ネットワーク autostart を有効化
      ansible.builtin.command: virsh net-autostart default
      when: "virsh_default_info.rc != 0 or 'Autostart:      yes' not in virsh_default_info.stdout"
      become: true

    - name: default ネットワークを起動
      ansible.builtin.command: virsh net-start default
      when: "virsh_default_info.rc != 0 or 'Active:         yes' not in virsh_default_info.stdout"
      become: true
